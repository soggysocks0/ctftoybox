name: Build release artifacts

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build
        shell: pwsh
        run: ./packaging/build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ctftoybox-windows
          path: dist/CTFToyBox.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build
        run: |
          chmod +x packaging/build-linux.sh
          VERSION="${GITHUB_REF_NAME#v}" ./packaging/build-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ctftoybox-linux
          path: |
            dist/CTFToyBox
            dist/*.deb

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/ctftoybox-windows/CTFToyBox.exe
            artifacts/ctftoybox-linux/CTFToyBox
            artifacts/ctftoybox-linux/*.deb
          generate_release_notes: true